openapi: 3.1.0
info:
  title: MiraVeja ModelMora (Studio-local)
  version: "1.0.0"
  summary: The Studio's one place for open-weight model inference.
  description: |
    Reachable only from the Studio machine (FR-027). Not part of the Studio Link and never
    spoken to by the Museum side. Callers ask for a result and get one, or an honest answer
    about when they will; they never load, place or manage a model (FR-005).

    Source of truth: specs/002-modelmora-inference/contracts/modelmora-v1.yaml in the
    miraveja-ecosystem hub.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://127.0.0.1:{port}
    description: Loopback only. Binding any other interface is a defect (FR-027).
    variables:
      port:
        default: "8431"

security:
  - callerToken: []

tags:
  - name: requests
  - name: models
  - name: availability

paths:
  /modelmora/v1/requests:
    post:
      tags: [requests]
      operationId: submitRequest
      summary: Ask for text or an image.
      description: |
        Answers immediately (SC-003): accepted with a position and an estimate, or refused with
        a reason (FR-010). Never blocks for generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TextRequest"
                - $ref: "#/components/schemas/ImageRequest"
      responses:
        "202":
          description: Accepted and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "400": { $ref: "#/components/responses/Refused" }
        "401": { $ref: "#/components/responses/Refused" }
        "404": { $ref: "#/components/responses/Refused" }
        "409": { $ref: "#/components/responses/Refused" }
        "503": { $ref: "#/components/responses/Refused" }

  /modelmora/v1/requests/{requestId}:
    get:
      tags: [requests]
      operationId: askAboutRequest
      summary: Where a request stands, and its result once done.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: waitSeconds
          in: query
          schema: { type: integer, minimum: 0, maximum: 30, default: 0 }
          description: Wait this long for the state to change before answering.
      responses:
        "200":
          description: The request's current state, with its result when done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestStatus" }
        "401": { $ref: "#/components/responses/Refused" }
        "404": { $ref: "#/components/responses/Refused" }
    delete:
      tags: [requests]
      operationId: withdrawRequest
      summary: Withdraw a request that has not finished (FR-013).
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: Withdrawn, or already finished (the state says which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestStatus" }
        "401": { $ref: "#/components/responses/Refused" }
        "404": { $ref: "#/components/responses/Refused" }

  /modelmora/v1/requests/{requestId}/image:
    get:
      tags: [requests]
      operationId: fetchResultImage
      summary: Collect a finished image.
      description: Available until the holding time expires (FR-032).
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: The image bytes.
          content:
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Refused" }
        "404": { $ref: "#/components/responses/Refused" }

  /modelmora/v1/models:
    get:
      tags: [models]
      operationId: listModels
      summary: The models a caller may ask for, and the default per kind (FR-024).
      responses:
        "200":
          description: Servable models.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [models, defaults]
                properties:
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/ServableModel" }
                  defaults:
                    type: object
                    additionalProperties: false
                    required: [text, textWithImages, image]
                    properties:
                      text: { type: [string, "null"] }
                      textWithImages: { type: [string, "null"] }
                      image: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Refused" }

  /modelmora/v1/availability:
    get:
      tags: [availability]
      operationId: availability
      summary: Starting, running or stopping, and how long the line is (FR-029).
      responses:
        "200":
          description: Current availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "401": { $ref: "#/components/responses/Refused" }

components:
  securitySchemes:
    callerToken:
      type: http
      scheme: bearer
      description: |
        Names the calling Studio component (R-9) so a caller sees only its own requests
        (FR-017). Loopback is the security boundary; this is an ownership marker.

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Refused:
      description: The request is refused, with a reason the caller can act on (FR-011).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Refusal" }

  schemas:
    ModelRef:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        version: { type: string, minLength: 1, maxLength: 100 }

    TextRequest:
      type: object
      additionalProperties: false
      required: [kind, instructions]
      properties:
        kind: { const: text }
        model:
          $ref: "#/components/schemas/ModelRef"
          description: Omit for the default; never substituted (FR-004, FR-007).
        instructions: { type: string, minLength: 1, maxLength: 200000 }
        conversation:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [speaker, text]
            properties:
              speaker: { enum: [caller, model] }
              text: { type: string, maxLength: 200000 }
        images:
          type: array
          maxItems: 8
          description: |
            Images for the model to read (FR-003). Requires a text model that reads images;
            otherwise refused as invalid_request.
          items:
            type: object
            additionalProperties: false
            required: [mediaType, base64]
            properties:
              mediaType: { enum: [image/png, image/jpeg, image/webp] }
              base64: { type: string }
        settings:
          type: object
          additionalProperties: false
          properties:
            seed: { type: integer }
            maxLength: { type: integer, minimum: 1, maximum: 32000 }
            temperature: { type: number, minimum: 0, maximum: 2 }

    ImageRequest:
      type: object
      additionalProperties: false
      required: [kind, description, size]
      properties:
        kind: { const: image }
        model: { $ref: "#/components/schemas/ModelRef" }
        description: { type: string, minLength: 1, maxLength: 20000 }
        avoid: { type: string, maxLength: 20000 }
        size:
          type: object
          additionalProperties: false
          required: [width, height]
          properties:
            width: { type: integer, minimum: 64, maximum: 4096 }
            height: { type: integer, minimum: 64, maximum: 4096 }
        settings:
          type: object
          additionalProperties: false
          properties:
            seed: { type: integer }
            steps: { type: integer, minimum: 1, maximum: 200 }
            guidance: { type: number, minimum: 0, maximum: 30 }

    Accepted:
      type: object
      additionalProperties: false
      required: [requestId, position, estimatedWaitSeconds, model]
      properties:
        requestId: { type: string, format: uuid }
        position: { type: integer, minimum: 0, description: 0 means it is running now. }
        estimatedWaitSeconds:
          type: integer
          minimum: 0
          description: Measured from this Studio's own history, not declared (FR-018).
        model:
          $ref: "#/components/schemas/ModelRef"
          description: The model that will serve it, resolved now so the caller knows.

    RequestStatus:
      type: object
      additionalProperties: false
      required: [requestId, state]
      properties:
        requestId: { type: string, format: uuid }
        state:
          enum: [waiting, running, done, failed, withdrawn, stopped_before_completion]
        position: { type: [integer, "null"], minimum: 0 }
        estimatedWaitSeconds: { type: [integer, "null"], minimum: 0 }
        result: { $ref: "#/components/schemas/Result" }
        failure: { $ref: "#/components/schemas/Refusal" }

    Result:
      type: object
      additionalProperties: false
      required: [model, settingsUsed]
      properties:
        model: { $ref: "#/components/schemas/ModelRef" }
        text: { type: [string, "null"] }
        imageAvailable:
          type: boolean
          default: false
          description: Collect the bytes with fetchResultImage while the holding time lasts.
        settingsUsed:
          type: object
          description: "What actually ran: seed, size, steps, length (FR-002)."
          additionalProperties: true
        filterNote:
          type: [string, "null"]
          description: Set when the model's own built-in filter changed the output (FR-008).
        heldUntil: { type: string, format: date-time }

    ServableModel:
      type: object
      additionalProperties: false
      required: [name, version, kind, readsImages, license]
      properties:
        name: { type: string }
        version: { type: string }
        kind: { enum: [text, image] }
        readsImages: { type: boolean }
        license: { type: string }

    Availability:
      type: object
      additionalProperties: false
      required: [state, queueLength, servable]
      properties:
        state: { enum: [starting, running, stopping] }
        queueLength:
          type: integer
          minimum: 0
          description: The length of the line only — never another caller's requests (FR-017).
        servable:
          type: object
          additionalProperties: false
          required: [text, image]
          properties:
            text: { type: integer, minimum: 0 }
            image: { type: integer, minimum: 0 }

    Refusal:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          enum:
            - busy
            - starting
            - stopping
            - unknown_model
            - model_unavailable
            - invalid_request
            - cannot_be_served_on_this_studio
            - failed_during_generation
        detail:
          type: [string, "null"]
          maxLength: 2000
          description: |
            For the team. Never carries request or result content (FR-030), and never a
            content judgment (FR-008).
        retryAfterSeconds:
          type: [integer, "null"]
          minimum: 0
          description: Present with busy, starting and stopping (FR-011).
